version: '3.8'

services:
  service:
      volumes:
        - ./:/eqasim
        - /tmp/.X11-unix:/tmp/.X11-unix
        - ~/.Xauthority:/root/.Xauthority
        - ~/.bash_history:/home/user/.bash_history
        - ~/.gitconfig:/etc/gitconfig
        - ~/.ssh:/home/user/.ssh
        - /mnt/slow/airplane/:/mnt/slow/airplane/

      network_mode: "host"
      build:
        dockerfile: Dockerfile
        context: .
      image: ${REGISTRY_URL}/eqasim:latest

      tty: true
      stdin_open: true
      privileged: true
      restart: unless-stopped

      environment:
        - DISPLAY=:0
        - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}

version: '3.8'

services:
  service:
      volumes:
        - ./data:/app/data
        - ./output:/app/output
        - ./scripts:/app/scripts
        - ./tests:/app/tests

        - /tmp/.X11-unix:/tmp/.X11-unix
        - ~/.Xauthority:/root/.Xauthority
        - ~/.bash_history:/home/user/.bash_history
        - ~/.gitconfig:/etc/gitconfig
        - ~/.ssh:/home/user/.ssh
      shm_size: "16gb"
      network_mode: "host"
      build:
        dockerfile: Dockerfile
        context: .
      image: ${REGISTRY_URL}/melbourne-demand:latest

      tty: true
      stdin_open: true
      privileged: true
      restart: unless-stopped

      environment:
        - DISPLAY=:0
        - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
        - NVIDIA_VISIBLE_DEVICES=void
